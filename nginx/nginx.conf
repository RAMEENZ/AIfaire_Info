# Connection: upgrade UNIQUEMENT sur une vraie négociation WebSocket. Posé
# inconditionnellement, l'en-tête annonçait une mise à niveau inexistante sur
# chaque requête HTTP ordinaire, ce qui casse le keep-alive vers le frontend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limite de débit de l'API : chaque appel à /api/events déclenche une requête
# PostGIS. Le cache Redis amortit, mais rien n'empêchait un aspirateur de
# marteler l'endpoint. 10 req/s par visiteur avec une réserve de 20 : très
# au-dessus d'une navigation humaine, suffisant pour écrêter un script.
#
# La clé est l'IP RÉELLE du visiteur, restituée par real_ip ci-dessous. Sans
# cela, nginx voyait l'IP du tunnel cloudflared, identique pour tout le monde :
# les 10 req/s étaient partagés par l'ensemble des visiteurs, et trois
# navigateurs simultanés (≈6 requêtes chacun au chargement) suffisaient à
# déclencher des 429. Même travers pour le plafond de connexions SSE.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# Flux SSE : une connexion longue par onglet, plafond distinct et généreux.
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

server {
    listen 80;
    server_name _;

    # IP réelle du visiteur derrière Cloudflare Tunnel. cloudflared tourne dans
    # le réseau Docker et transmet l'adresse d'origine dans CF-Connecting-IP ;
    # sans ces directives, $binary_remote_addr vaut l'IP du conteneur pour tout
    # le monde et les limites par IP deviennent des limites globales.
    # Les plages listées sont privées : nginx n'est joignable que depuis le
    # réseau Docker (port publié sur 127.0.0.1), aucun client externe ne peut
    # donc usurper cet en-tête.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Docker DNS interne — résout les noms de service (backend, frontend) dynamiquement.
    # Sans ça, nginx cache l'IP au démarrage et retourne 502 si le container redémarre.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Désactive le buffering pour les Server-Sent Events (temps réel)
    proxy_buffering off;

    # ── Durcissement ─────────────────────────────────────────────────────────
    # Masque la version nginx et l'en-tête X-Powered-By (fuite de stack).
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # En-têtes de sécurité (TLS terminé chez Cloudflare, propagés au client).
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000"               always;

    # Content-Security-Policy — vérifiée contre l'application réelle (carte
    # montée, tuiles chargées, aucune violation console) avant activation.
    # Les origines tierces autorisées sont exactement celles dont dépend la
    # carte : tuiles OpenStreetMap et géocodage inverse Nominatim.
    #   - unpkg.com a été RETIRÉ des trois directives le 11/08/2026. Le front
    #     y chargeait leaflet.heat, du code exécutable servi par un tiers sans
    #     contrôle d'intégrité : un paquet compromis exécutait du JavaScript
    #     arbitraire chez le lecteur. Le greffon est désormais empaqueté avec
    #     l'application, et les images de marqueur servies depuis /leaflet.
    #   - 'unsafe-inline' (script) : Next.js injecte son état d'hydratation en
    #     ligne, sans nonce en export statique. Une politique par nonce
    #     supposerait de générer l'en-tête par requête côté Next.
    #   - 'unsafe-eval' a été RETIRÉ le 22/08/2026. Il était conservé « pour ne
    #     pas diverger » avec le mode développement — mais nginx ne sert que le
    #     build de production, qui n'en a pas besoin : aucun `eval(` ni
    #     `new Function(` dans les bundles, et l'application se monte carte
    #     comprise sous une politique qui l'interdit (e2e/csp.spec.ts rejoue
    #     cet en-tête et échouerait si une dépendance venait à l'exiger).
    #     C'était la directive la plus coûteuse de la politique : elle rend
    #     inopérante la principale protection de la CSP contre l'injection.
    #   - raw.githubusercontent.com a été RETIRÉ de connect-src le 30/08/2026.
    #     Le front y chargeait le GeoJSON des départements, chez chaque
    #     visiteur, sur une branche `master` non épinglée ; le fichier est
    #     désormais servi par l'application (frontend/public/departements.geojson,
    #     provenance et licence documentées dans FranceMap.tsx). Même geste que
    #     pour unpkg.com : une origine tierce de moins à qui faire confiance.
    #   - connect-src ne garde plus que 'self' et Nominatim : le front appelle
    #     l'API en relatif (/api) via nginx, jamais en cross-origin.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'";
    add_header Content-Security-Policy  $csp                              always;

    # Flux SSE : exclu de limit_req (une connexion longue, pas des rafales)
    # mais borné en nombre de connexions simultanées par IP.
    location /api/events/stream {
        limit_conn          sse_conn 12;
        proxy_pass          http://backend:8000/api/events/stream;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering     off;
    }

    # Backend API
    location /api/ {
        # burst=20 : absorbe la rafale du chargement initial (événements,
        # carte, santé, brief…) ; nodelay pour ne pas retarder ces requêtes
        # légitimes. Au-delà, réponse 429.
        limit_req          zone=api_limit burst=20 nodelay;
        limit_req_status   429;
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE : pas de timeout agressif
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # NB : /docs, /redoc et /openapi.json ne sont volontairement plus routés ici.
    # La doc interactive est désactivée côté FastAPI (ENABLE_DOCS=false) afin de
    # ne pas exposer publiquement la surface de l'API. Ces chemins retombent sur
    # le frontend (404) ci-dessous.

    # Assets Next.js versionnés par empreinte (/_next/static/...) : leur URL
    # change à chaque build, ils peuvent donc être mis en cache indéfiniment.
    # NB : un `add_header` dans un location annule ceux du bloc server —
    # les en-têtes de sécurité sont donc répétés ici et plus bas.
    location /_next/static/ {
        proxy_pass             http://frontend:3000/_next/static/;
        proxy_set_header       Host              $host;
        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000"               always;
        add_header Content-Security-Policy  $csp                              always;
        add_header Cache-Control            "public, max-age=31536000, immutable" always;
    }

    # Frontend Next.js (tout le reste)
    location / {
        proxy_pass             http://frontend:3000/;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        # WebSocket support (Next.js dev HMR + future ws)
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection $connection_upgrade;
        proxy_read_timeout     600s;

        # Next.js annonce `s-maxage=31536000` sur ses pages statiques : un HTML
        # conservé un an continue de référencer des chunks JS supprimés au
        # déploiement suivant — le visiteur reste bloqué sur l'ancienne
        # interface. Le HTML doit être revalidé à chaque visite (no-cache =
        # requête conditionnelle, pas de re-téléchargement si inchangé) ;
        # seuls les assets hashés ci-dessus sont cachés durablement.
        proxy_hide_header      Cache-Control;
        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000"               always;
        add_header Content-Security-Policy  $csp                              always;
        add_header Cache-Control            "no-cache"                        always;
    }
}
