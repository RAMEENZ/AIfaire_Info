# Rotation des logs : sans borne, le driver json-file grossit indéfiniment et
# finit par remplir le disque (le backend logge à chaque ingestion). 3 fichiers
# de 10 Mo max par conteneur. Prend effet à la recréation du conteneur.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgis/postgis:16-3.4
    # Seul service qui n'avait PAS de politique de redémarrage (défaut: no) :
    # au redémarrage du démon Docker (MAJ automatiques…), tout revenait sauf la
    # base → backend en crash-loop, site down. Incident du 02/07/2026.
    restart: unless-stopped
    environment:
      POSTGRES_DB: faire_info
      POSTGRES_USER: faire_info
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD (mot de passe DB fort) dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faire_info"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    # Branche épinglée : les correctifs 7.4.x passent, pas les sauts majeurs.
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    logging: *default-logging
    build: ./backend
    # Bind sur localhost uniquement : le backend n'est PAS exposé sur Internet.
    # cloudflared et nginx le joignent par le réseau Docker interne (backend:8000).
    ports:
      - "127.0.0.1:8000:8000"
    # Transmet le .env au conteneur. Sans cela, seules les variables listées
    # sous `environment:` parvenaient au backend : dix-huit réglages présentés
    # comme configurables dans le README — INGEST_HOURS, BRIEF_HOURS,
    # RESPECT_ROBOTS_TXT, HEALTHZ_*, SCHEDULER_TIMEZONE… — ne pouvaient en
    # réalité être changés qu'en modifiant config.py. Le `env_file` de
    # pydantic-settings ne rattrapait rien : il lit un .env DANS le conteneur,
    # qui n'y est pas monté.
    # `environment:` reste prioritaire sur `env_file` (règle Compose) : les
    # valeurs construites ci-dessous, DATABASE_URL en tête, gardent la main.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://faire_info:${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD dans .env}@db:5432/faire_info
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      METEO_FRANCE_API_KEY: ${METEO_FRANCE_API_KEY:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      FETCH_FULL_ARTICLES: ${FETCH_FULL_ARTICLES:-true}
      MAX_PRESSE_ARTICLES: ${MAX_PRESSE_ARTICLES:-120}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # Notifications Web Push — vides par défaut : la fonctionnalité reste
      # inerte tant qu'une paire VAPID n'est pas générée (voir README).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-}
      WEBHOOK_THRESHOLD: ${WEBHOOK_THRESHOLD:-3}
      # Commit déployé (facultatif) : docker compose … avec GIT_SHA=$(git rev-parse --short HEAD)
      GIT_SHA: ${GIT_SHA:-}
      # Logs applicatifs persistants : survivent à la recréation du conteneur
      # (contrairement aux logs Docker json-file, détruits avec lui).
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz teste la vraie santé (scheduler vivant + données fraîches),
      # pas seulement « l'API répond ». Panne silencieuse de 07/2026 :
      # scheduler mort 3 jours dans un conteneur « healthy » via GET /.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=8).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # autoheal redémarre ce conteneur quand il devient unhealthy.
    labels:
      autoheal: "true"
    restart: unless-stopped

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      args:
        # URL relative → nginx route /api/ vers le backend (fonctionne en local ET via tunnel)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        # Origine publique du site. Sert de racine aux URL absolues des
        # métadonnées : og:image doit être absolue et joignable depuis
        # l'extérieur, sinon les aperçus de partage restent vides. À adapter
        # si le domaine change (NEXT_PUBLIC_SITE_URL dans .env).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://aifaire.ramenz.qzz.io}
    # Bind sur localhost uniquement : le front passe par nginx (réseau interne),
    # jamais en direct depuis Internet. Ferme l'accès brut http://IP:3000.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    logging: *default-logging
    # Branche stable épinglée (1.30 = stable, 1.31 = mainline) : un tag
    # flottant peut casser à la recréation du conteneur.
    image: nginx:1.30-alpine
    # cloudflared joint nginx via le réseau interne Docker (nginx:80), pas par ce
    # port hôte. Bind sur localhost : le mapping ne sert qu'aux tests locaux
    # (curl http://localhost:8088/) et n'expose rien sur Internet.
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Redémarre automatiquement les conteneurs marqués `autoheal: "true"` quand
  # leur healthcheck passe unhealthy (Docker seul ne redémarre jamais un
  # conteneur unhealthy). Nécessite le socket Docker : accès root-équivalent
  # au démon, limité ici à un conteneur sans port exposé qui ne surveille que
  # les conteneurs étiquetés. Sans cette brique, un backend zombie (API vive,
  # scheduler mort) resterait en panne jusqu'à une intervention manuelle.
  autoheal:
    logging: *default-logging
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # Arrêt gracieux : uvicorn a 30 s pour finir les requêtes en cours
      # avant le kill (défaut autoheal : 10 s). Pas de risque de boucle
      # serrée : après redémarrage, /healthz tolère 30 min de démarrage
      # (HEALTHZ_BOOT_GRACE_MINUTES) avant d'exiger des données fraîches.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  cloudflared:
    logging: *default-logging
    # Version épinglée (pas de branche stable chez cloudflared) : `latest`
    # peut casser le tunnel à la recréation. À bumper lors des déploiements.
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared/config.yml:/home/nonroot/.cloudflared/config.yml:ro
    command: --config /home/nonroot/.cloudflared/config.yml tunnel --no-autoupdate run
    depends_on:
      - nginx

volumes:
  pgdata:
